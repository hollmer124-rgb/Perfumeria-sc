<div class="absolute -bottom-36 -right-24 w-96 h-96 bg-primary/10 rounded-full blur-3xl pointer-events-none"></div>

<div class="relative w-full max-w-md bg-surface-container-lowest shadow-xl rounded-xl p-space-lg md:p-space-xl transition-all duration-300">
<!-- Header: Logo & Branding -->
<div class="flex flex-col items-center text-center mb-space-xl">

<div class="w-16 h-16 rounded-xl bg-primary-container flex items-center justify-center text-on-primary shadow-sm mb-space-md">

<rect fill="currentColor" height="4" rx="2" width="12" x="18" y="12"></rect>
<!-- Bottle Body -->
<rect fill="none" height="26" rx="7" stroke="currentColor" stroke-width="3" width="30" x="9" y="16"></rect>
<!-- Fragrance Core Essence Dot -->
<circle cx="24" cy="29" fill="#34d399" r="5"></circle>
</svg>
</div>
<div class="space-y-space-xs"><h1 class="font-headline-xl text-headline-xl text-on-surface tracking-tight">Perfumería SC</h1>
</div>
<p class="mt-space-sm font-body-sm text-body-sm text-on-surface-variant max-w-xs">Portal de gestión y control financiero consolidado. Ingresa con tus credenciales maestras de administrador.</p>
</div>
<!-- Login Form -->
<form class="flex flex-col space-y-space-md" id="loginForm">
<div aria-live="polite" class="hidden rounded-lg border border-rose-200 bg-rose-50 px-4 py-3 text-sm font-medium text-rose-700" id="loginError" role="alert"></div>
<!-- Email Field -->
<div class="flex flex-col space-y-space-xs">
<label class="font-label-lg text-label-lg text-on-surface flex items-center justify-between" for="emailInput">
<span>Correo electrónico</span>
<span class="font-body-sm text-body-sm text-on-surface-variant text-opacity-70 font-normal">Requerido</span>
</label>
<div class="relative flex items-center">
<span class="absolute left-space-md text-outline pointer-events-none flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">mail</span>
</span>
<input autocomplete="email" class="w-full h-12 pl-11 pr-space-md bg-surface-container-low text-on-surface placeholder:text-outline/70 rounded-lg font-body-md text-body-md transition-colors focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" id="emailInput" name="email" placeholder="ejemplo@perfumeriasc.com" required="" type="email">
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col space-y-space-xs">
<div class="flex items-center justify-between">
<label class="font-label-lg text-label-lg text-on-surface" for="passwordInput">Contraseña</label>
</div>
<div class="relative flex items-center">
<span class="absolute left-space-md text-outline pointer-events-none flex items-center justify-center">
<span class="material-symbols-outlined text-[20px]">lock</span>
</span>
<input autocomplete="current-password" class="w-full h-12 pl-11 pr-12 bg-surface-container-low text-on-surface placeholder:text-outline/70 rounded-lg font-body-md text-body-md transition-colors focus:bg-surface-container-lowest focus:outline-none focus:ring-2 focus:ring-primary shadow-sm" id="passwordInput" name="password" placeholder="••••••••" required="" type="password">
<button aria-label="Mostrar u ocultar contraseña" class="absolute right-space-md text-outline hover:text-on-surface transition-colors flex items-center justify-center p-1 rounded focus:outline-none focus:ring-2 focus:ring-primary" id="togglePasswordBtn" onclick="togglePasswordVisibility()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Remember Device Checkbox -->

<!-- Action Button -->
<div class="pt-space-sm">
<button class="w-full h-12 bg-primary-container hover:bg-primary text-on-primary rounded-lg font-label-lg text-label-lg flex items-center justify-center space-x-space-sm shadow-md hover:shadow-lg transition-all active:scale-[0.99] focus:outline-none focus:ring-2 focus:ring-primary-container focus:ring-offset-2" id="submitBtn" type="submit">

<div class="relative my-space-lg flex items-center justify-center">

</div>
<!-- Security & Trust Badge -->

<!-- Copyright Footer -->
<div class="mt-space-lg text-center">
<p class="font-body-sm text-body-sm text-outline">
        © 2025 Perfumería SC. Todos los derechos reservados.
      </p>
</div>
</div>
<!-- Help floating note for administrative staff -->
<div class="mt-space-md text-center"><div class="flex items-center justify-center space-x-space-xs text-on-surface-variant text-body-sm">
<span class="material-symbols-outlined text-[16px] text-primary">lock</span>
<span>Conexión segura cifrada de extremo a extremo</span>
</div></div>
</div>
<script>
  function togglePasswordVisibility() {
    const passwordInput = document.getElementById('passwordInput');
    const passwordIcon = document.getElementById('passwordIcon');
    
    if (passwordInput.type === 'password') {
      passwordInput.type = 'text';
      passwordIcon.textContent = 'visibility_off';
    } else {
      passwordInput.type = 'password';
      passwordIcon.textContent = 'visibility';
    }
  }

</script></main>
